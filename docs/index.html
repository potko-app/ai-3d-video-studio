<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetra3D Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: #121216;
      border: 1px solid #24242b;
      border-radius: 14px;
      padding: 18px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
      color: #f1f5f9;
    }
    .screen {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid #27272a;
    }
    canvas, video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    video { display: none; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.82);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .status {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 10px;
    }
    .bar {
      width: 220px;
      height: 6px;
      background: #27272a;
      border-radius: 99px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 5%;
      background: #6366f1;
      transition: width 0.25s ease;
    }
    .dl-btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .dl-btn.disabled {
      background: #222228;
      color: #71717a;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="titleEl">Kinetra3D Studio</h1>

    <div class="screen">
      <canvas id="stageCanvas" width="1280" height="720"></canvas>
      <video id="finalVideo" controls playsinline loop></video>
      <div class="overlay" id="loaderOverlay">
        <div class="status" id="statusEl">Creating 3D Pixar Scenes & Natural Voice...</div>
        <div class="bar"><div class="fill" id="progressEl"></div></div>
      </div>
    </div>

    <a id="downloadBtn" class="dl-btn disabled" download="kinetra3d-movie.webm">Generating Video...</a>
  </div>

  <script>
    function b64DecodeUnicode(str) {
      return decodeURIComponent(atob(str).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    }

    let data = {
      title: "Magical Forest Adventure",
      narration: "हे भगवान... [breath] यह जंगल तो सच में जादुई है! [cough] अरे वाह, देखो सामने क्या चमक रहा है!",
      atmosphere: "magical_forest",
      code: ""
    };

    try {
      const hash = window.location.hash;
      if (hash.startsWith("#scene=")) {
        const parsed = JSON.parse(b64DecodeUnicode(hash.replace("#scene=", "")));
        if (parsed) data = { ...data, ...parsed };
      }
    } catch (e) {}

    document.getElementById("titleEl").textContent = data.title || "Kinetra3D Studio";
    const statusEl = document.getElementById("statusEl");
    const progressEl = document.getElementById("progressEl");
    const downloadBtn = document.getElementById("downloadBtn");

    // Extract extra scene visual hints if AI passed comments/strings in code
    function extractVisualSubject() {
      let extra = "";
      if (data.code) {
        const matches = data.code.match(/\/\/.*|['"`][a-zA-Z0-9\s,.-]{10,80}['"`]/g);
        if (matches) extra = matches.slice(0, 3).join(" ").replace(/\/\/|['"`]/g, "");
      }
      return `${data.title}. ${extra}`.trim();
    }

    // Generate 4 Consistent 3D Pixar Style Frames with Locked Seed
    async function loadPixarScenes() {
      const subject = extractVisualSubject();
      const lockedSeed = Math.abs(subject.split("").reduce((a, b) => ((a << 5) - a) + b.charCodeAt(0), 0)) % 999999 + 1000;
      const angles = [
        "wide establishing cinematic shot, dramatic volumetric lighting, 3D Pixar Disney animation style, 8k, ultra detailed",
        "medium character close-up shot, expressive face and eyes, Pixar 3D animated movie frame, soft rim light, 8k",
        "dynamic low-angle action shot, depth of field, glowing atmosphere, Pixar 3D cinema render, 8k",
        "emotional golden cinematic ending shot, rich textures, Pixar 3D animation masterpiece, 8k"
      ];

      const images = [];
      for (let i = 0; i < angles.length; i++) {
        statusEl.textContent = `Rendering 3D Scene ${i + 1} of 4...`;
        progressEl.style.width = `${15 + i * 15}%`;
        const prompt = encodeURIComponent(`${subject}, ${angles[i]}`);
        const url = `https://image.pollinations.ai/prompt/${prompt}?width=1280&height=720&seed=${lockedSeed}&nologo=true&model=flux`;
        const img = await loadImageSafe(url, i);
        images.push(img);
      }
      return images;
    }

    function loadImageSafe(url, idx) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        const timer = setTimeout(() => resolve(createFallbackFrame(idx)), 14000);
        img.onload = () => { clearTimeout(timer); resolve(img); };
        img.onerror = () => { clearTimeout(timer); resolve(createFallbackFrame(idx)); };
        img.src = url;
      });
    }

    function createFallbackFrame(idx) {
      const c = document.createElement("canvas");
      c.width = 1280; c.height = 720;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(640, 360, 60, 640, 360, 720);
      const palettes = [["#1e1b4b", "#09090b"], ["#064e3b", "#09090b"], ["#4c0519", "#09090b"], ["#172554", "#09090b"]];
      grad.addColorStop(0, palettes[idx % 4][0]);
      grad.addColorStop(1, palettes[idx % 4][1]);
      g.fillStyle = grad;
      g.fillRect(0, 0, 1280, 720);
      return c;
    }

    // Procedural Realistic Human Breath & Cough SFX via Web Audio API
    function playNaturalBreath(ctx, dest, time, isCough = false) {
      const dur = isCough ? 0.32 : 0.48;
      const bufSize = Math.floor(ctx.sampleRate * dur);
      const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        const t = i / bufSize;
        const env = isCough
          ? Math.sin(Math.min(1, t * 4) * Math.PI) * Math.exp(-t * 6)
          : Math.sin(t * Math.PI) * 0.45;
        output[i] = (Math.random() * 2 - 1) * env;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = isCough ? 650 : 950;
      filter.Q.value = isCough ? 1.8 : 0.9;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(isCough ? 0.45 : 0.22, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(dest);
      gain.connect(ctx.destination);
      noise.start(time);
    }

    // Fetch Neural TTS Audio Buffer so it records cleanly into video
    async function fetchVoiceBuffer(ctx, text) {
      const clean = text.replace(/\[breath\]|\[cough\]|\[sigh\]/gi, "").trim();
      if (!clean) return null;
      const isHindi = /[\u0900-\u097F]/.test(clean);
      const voice = isHindi ? "Aditi" : "Matthew";
      const urls = [
        `https://api.streamelements.com/kappa/v2/speech?voice=${voice}&text=${encodeURIComponent(clean)}`,
        `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${isHindi ? "hi" : "en"}&q=${encodeURIComponent(clean.slice(0, 200))}`
      ];
      for (const u of urls) {
        try {
          const res = await fetch(u);
          if (!res.ok) continue;
          const arr = await res.arrayBuffer();
          return await ctx.decodeAudioData(arr);
        } catch (e) {}
      }
      return null;
    }

    async function buildAndRecordMovie() {
      const scenes = await loadPixarScenes();
      statusEl.textContent = "Recording Natural Voice & Cinema Video...";
      progressEl.style.width = "75%";

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioCtx();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      const audioDest = audioCtx.createMediaStreamDestination();

      // Subtle Cinematic Ambient Pad
      const osc = audioCtx.createOscillator();
      const padGain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 110;
      padGain.gain.value = 0.025;
      osc.connect(padGain);
      padGain.connect(audioDest);
      osc.start();

      // Split narration into natural phrases with breath/cough cues
      const rawNarration = (data.narration || "").trim();
      const parts = rawNarration.split(/(\[breath\]|\[cough\]|\[sigh\]|[।!?.,]+)/i).filter(p => p && p.trim());
      let scheduleTime = audioCtx.currentTime + 0.3;
      let totalAudioDuration = 0;

      for (const part of parts) {
        const lower = part.toLowerCase().trim();
        if (lower === "[cough]") {
          playNaturalBreath(audioCtx, audioDest, scheduleTime, true);
          scheduleTime += 0.45;
        } else if (lower === "[breath]" || lower === "[sigh]") {
          playNaturalBreath(audioCtx, audioDest, scheduleTime, false);
          scheduleTime += 0.5;
        } else if (/^[।!?.,]+$/.test(lower)) {
          // Natural breath pause at sentence end
          playNaturalBreath(audioCtx, audioDest, scheduleTime, false);
          scheduleTime += 0.38;
        } else {
          const buf = await fetchVoiceBuffer(audioCtx, part);
          if (buf) {
            const src = audioCtx.createBufferSource();
            src.buffer = buf;
            src.connect(audioDest);
            src.connect(audioCtx.destination);
            src.start(scheduleTime);
            scheduleTime += buf.duration + 0.12;
          }
        }
      }
      totalAudioDuration = Math.max(12000, Math.min(25000, (scheduleTime - audioCtx.currentTime + 0.8) * 1000));

      // Combine Canvas Video Stream + Mixed Audio Stream
      const canvas = document.getElementById("stageCanvas");
      const ctx2d = canvas.getContext("2d");
      const videoStream = canvas.captureStream(30);
      const combinedStream = new MediaStream([
        ...videoStream.getVideoTracks(),
        ...audioDest.stream.getAudioTracks()
      ]);

      const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
        ? "video/webm;codecs=vp9,opus"
        : "video/webm";
      const recorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: 5000000 });
      const chunks = [];

      recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        osc.stop();
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);

        document.getElementById("loaderOverlay").style.display = "none";
        canvas.style.display = "none";

        const vid = document.getElementById("finalVideo");
        vid.src = url;
        vid.style.display = "block";
        vid.play().catch(() => {});

        downloadBtn.href = url;
        downloadBtn.download = (data.title.replace(/[^a-z0-9]/gi, "_").toLowerCase() || "kinetra3d") + ".webm";
        downloadBtn.textContent = "Download Video";
        downloadBtn.classList.remove("disabled");
      };

      // Floating dust/sparkle particles
      const particles = Array.from({ length: 45 }, () => ({
        x: Math.random() * 1280,
        y: Math.random() * 720,
        r: 1.5 + Math.random() * 2.5,
        vy: -0.3 - Math.random() * 0.6,
        vx: (Math.random() - 0.5) * 0.4
      }));

      const startTime = performance.now();
      recorder.start();

      function animateFrame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / totalAudioDuration);
        progressEl.style.width = `${75 + Math.floor(progress * 25)}%`;

        const sceneFloat = progress * scenes.length;
        const idx = Math.min(scenes.length - 1, Math.floor(sceneFloat));
        const localP = sceneFloat - idx;
        const img = scenes[idx];

        // Smooth 3D Cinema Camera Zoom & Pan + Voice Pulse
        const voicePulse = Math.abs(Math.sin(elapsed * 0.014)) * 0.012;
        const scale = 1.04 + localP * 0.1 + voicePulse;
        const panX = (idx % 2 === 0 ? -1 : 1) * (localP - 0.5) * 45;
        const panY = Math.sin(localP * Math.PI) * -15;

        ctx2d.fillStyle = "#000";
        ctx2d.fillRect(0, 0, 1280, 720);

        ctx2d.save();
        ctx2d.translate(640 + panX, 360 + panY);
        ctx2d.scale(scale, scale);
        ctx2d.drawImage(img, -640, -360, 1280, 720);
        ctx2d.restore();

        // Atmospheric Particles
        ctx2d.fillStyle = "rgba(255, 245, 200, 0.55)";
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.y < 0) p.y = 720;
          if (p.x < 0) p.x = 1280;
          if (p.x > 1280) p.x = 0;
          ctx2d.beginPath();
          ctx2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx2d.fill();
        }

        // Subtle Cinema Vignette
        const vig = ctx2d.createRadialGradient(640, 360, 380, 640, 360, 760);
        vig.addColorStop(0, "rgba(0,0,0,0)");
        vig.addColorStop(1, "rgba(0,0,0,0.45)");
        ctx2d.fillStyle = vig;
        ctx2d.fillRect(0, 0, 1280, 720);

        if (progress < 1) {
          requestAnimationFrame(animateFrame);
        } else {
          recorder.stop();
        }
      }

      requestAnimationFrame(animateFrame);
    }

    buildAndRecordMovie();
  </script>
</body>
</html>
