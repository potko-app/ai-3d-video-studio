<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetra3D — Public 3D Animation Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      width: 100%;
      max-width: 680px;
      background: #121216;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 18px;
      height: fit-content;
    }
    h1 { font-size: 19px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 16px; line-height: 1.45; }
    .stage {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid #27272a;
    }
    canvas, video { width: 100%; height: 100%; display: block; object-fit: cover; }
    video { display: none; }
    .hud {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(9, 9, 11, 0.88);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .bar { width: 150px; height: 5px; background: #27272a; border-radius: 3px; margin-top: 5px; overflow: hidden; }
    .fill { height: 100%; width: 0%; background: #6366f1; transition: width 0.15s linear; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary { background: #6366f1; color: #fff; grid-column: span 2; font-size: 14px; }
    .btn-primary.disabled { background: #27272a; color: #71717a; pointer-events: none; }
    .btn-secondary { background: #1c1c22; color: #e2e8f0; border: 1px solid #3f3f46; }
  </style>
</head>
<body>
  <div class="box">
    <h1 id="videoTitle">Kinetra3D Studio</h1>
    <p id="narrationText" class="sub">Initializing 3D Render Engine...</p>

    <div class="stage" id="stage">
      <video id="recordedVideo" controls playsinline loop></video>
      <div class="hud" id="hud">
        <div>
          <span id="statusText">🔴 Rendering & Recording 3D Video...</span>
          <div class="bar"><div class="fill" id="progressFill"></div></div>
        </div>
        <span id="timerText">15s</span>
      </div>
    </div>

    <div class="actions">
      <a id="downloadLink" class="btn btn-primary disabled" download="kinetra3d-video.webm">⏳ Recording Video (15s)...</a>
      <button id="voiceBtn" class="btn btn-secondary">🔊 Replay Voiceover</button>
      <button id="blenderBtn" class="btn btn-secondary">📦 Blender Script (.py)</button>
    </div>
  </div>

  <script>
    function b64DecodeUnicode(str) {
      return decodeURIComponent(atob(str).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    }

    let sceneData = {
      title: "Neon Cyber City Drive",
      narration: "रात के इस चमकते हुए निऑन शहर में रफ़्तार और रोशनी का जादू देखिए!",
      code: "",
      bpy: "import bpy\nbpy.ops.mesh.primitive_monkey_add(size=2)\nbpy.ops.object.shade_smooth()"
    };

    try {
      const hash = window.location.hash;
      if (hash.startsWith("#scene=")) {
        const decoded = JSON.parse(b64DecodeUnicode(hash.replace("#scene=", "")));
        if (decoded) sceneData = { ...sceneData, ...decoded };
      }
    } catch (e) { console.error("Scene decode error:", e); }

    document.getElementById("videoTitle").textContent = sceneData.title;
    document.getElementById("narrationText").textContent = sceneData.narration || "3D Animation";

    const stage = document.getElementById("stage");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060812);
    scene.fog = new THREE.FogExp2(0x060812, 0.028);

    const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.1, 250);
    camera.position.set(0, 3.5, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1280, 720);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    stage.insertBefore(renderer.domElement, stage.firstChild);

    // Pro 3-Point Studio Lighting
    scene.add(new THREE.HemisphereLight(0x818cf8, 0x0f172a, 1.1));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(8, 15, 10);
    keyLight.castShadow = true;
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.5);
    rimLight.position.set(-8, 6, -10);
    scene.add(rimLight);

    function buildDefaultScene() {
      const road = new THREE.Mesh(
        new THREE.PlaneGeometry(14, 120),
        new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.6, roughness: 0.25 })
      );
      road.rotation.x = -Math.PI / 2;
      road.receiveShadow = true;
      scene.add(road);

      const buildings = [];
      const neonColors = [0x38bdf8, 0xf43f5e, 0xa855f7, 0x10b981, 0xf59e0b];
      for (let i = 0; i < 36; i++) {
        const h = 3 + Math.random() * 9;
        const col = neonColors[i % neonColors.length];
        const b = new THREE.Mesh(
          new THREE.BoxGeometry(2.2, h, 2.2),
          new THREE.MeshStandardMaterial({ color: 0x1e293b, emissive: col, emissiveIntensity: 0.35, roughness: 0.3 })
        );
        const side = i % 2 === 0 ? -1 : 1;
        b.position.set(side * (5 + Math.random() * 4), h / 2, -60 + i * 3.5);
        scene.add(b);
        buildings.push(b);
      }

      // Sleek Sports Car
      const car = new THREE.Group();
      const chassis = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 0.5, 3.4),
        new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.8, roughness: 0.15 })
      );
      chassis.position.y = 0.5;
      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.3, 0.45, 1.7),
        new THREE.MeshStandardMaterial({ color: 0x09090b, metalness: 0.9, roughness: 0.1 })
      );
      cabin.position.set(0, 0.92, -0.2);
      const headLightL = new THREE.Mesh(new THREE.SphereGeometry(0.14), new THREE.MeshBasicMaterial({ color: 0xe0f2fe }));
      headLightL.position.set(-0.55, 0.52, 1.7);
      const headLightR = headLightL.clone();
      headLightR.position.x = 0.55;
      car.add(chassis, cabin, headLightL, headLightR);
      scene.add(car);

      window.animateScene = function(t, p) {
        buildings.forEach(b => {
          b.position.z += 0.45;
          if (b.position.z > 20) b.position.z = -100;
        });
        car.position.x = Math.sin(t * 2) * 1.4;
        car.rotation.y = Math.cos(t * 2) * 0.12;
        camera.position.set(Math.sin(p * Math.PI * 2) * 5.5, 2.8 + Math.sin(t) * 0.4, Math.cos(p * Math.PI * 2) * 6.5);
        camera.lookAt(car.position.x, 0.8, 0);
      };
    }

    if (sceneData.code && sceneData.code.trim().length > 15) {
      try {
        const runCustom = new Function("scene", "camera", "renderer", "THREE", sceneData.code);
        runCustom(scene, camera, renderer, THREE);
      } catch (err) {
        console.error("Fallback to default scene:", err);
        buildDefaultScene();
      }
    } else {
      buildDefaultScene();
    }

    // Real Video Capture
    const canvas = renderer.domElement;
    const stream = canvas.captureStream(30);
    const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
    const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 5000000 });
    const chunks = [];

    recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: "video/webm" });
      const videoUrl = URL.createObjectURL(blob);

      canvas.style.display = "none";
      document.getElementById("hud").style.display = "none";

      const vidEl = document.getElementById("recordedVideo");
      vidEl.src = videoUrl;
      vidEl.style.display = "block";
      vidEl.play().catch(() => {});

      const dl = document.getElementById("downloadLink");
      dl.href = videoUrl;
      dl.download = (sceneData.title.replace(/[^a-z0-9]/gi, "_").toLowerCase() || "kinetra3d") + ".webm";
      dl.textContent = "⬇️ Download Real 3D Video";
      dl.classList.remove("disabled");
    };

    function speakNarration() {
      if (!sceneData.narration || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(sceneData.narration);
      u.lang = /[\u0900-\u097F]/.test(sceneData.narration) ? "hi-IN" : "en-US";
      window.speechSynthesis.speak(u);
    }

    document.getElementById("voiceBtn").addEventListener("click", speakNarration);
    document.getElementById("blenderBtn").addEventListener("click", () => {
      const blob = new Blob([sceneData.bpy || "# Blender Script"], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "kinetra3d_blender_scene.py";
      a.click();
    });

    const DURATION = 15000;
    const startTime = performance.now();
    recorder.start();
    speakNarration();

    function renderLoop(now) {
      const elapsed = now - startTime;
      const progress = Math.min(1, elapsed / DURATION);
      const t = elapsed / 1000;

      if (typeof window.animateScene === "function") {
        try { window.animateScene(t, progress); } catch (e) {}
      }
      renderer.render(scene, camera);

      document.getElementById("progressFill").style.width = Math.floor(progress * 100) + "%";
      document.getElementById("timerText").textContent = Math.max(0, Math.ceil((DURATION - elapsed) / 1000)) + "s";

      if (progress < 1) {
        requestAnimationFrame(renderLoop);
      } else {
        recorder.stop();
      }
    }
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
