<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetra3D — Live Studio</title>
  <!-- Three.js और आवश्यक 3D लाइब्रेरीज़ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg: #09090B;
      --card: #131316;
      --border: #27272A;
      --accent: #6366F1;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; text-align: center; }
    p { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }
    
    /* Simple 3D Canvas / Player Box */
    #canvas-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
    }
    canvas { width: 100%; height: 100%; display: block; }
    
    .status-hud {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .progress-bar {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Kinetra3D Live Player</h1>
    <p id="description">Initializing local rendering engine...</p>

    <div id="canvas-container">
      <div id="statusHud" class="status-hud">
        <div>
          <span id="statusLabel" style="font-weight:600;">Building 3D Scene...</span>
          <div class="progress-bar" style="width: 150px;"><div id="progressBar" class="progress-fill"></div></div>
        </div>
        <div id="timeLabel" style="color:var(--text-muted);">15s left</div>
      </div>
    </div>

    <button id="downloadBtn" class="btn" disabled>Download 3D Video (MP4)</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const vidId = params.get("v") || "demo";
    
    const statusLabel = document.getElementById("statusLabel");
    const progressBar = document.getElementById("progressBar");
    const timeLabel = document.getElementById("timeLabel");
    const description = document.getElementById("description");
    const downloadBtn = document.getElementById("downloadBtn");

    // 1. Basic Three.js Scene Setup (बिना सर्वर लोड के हाई-क्वालिटी 3D)
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x09090b);
    scene.fog = new THREE.FogExp2(0x09090b, 0.05);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 3, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // cinematic Lights (सिनेमैटिक रोशनी)
    const ambientLight = new THREE.AmbientLight(0x0c0c0f);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0x6366f1, 2.0);
    mainLight.position.set(5, 10, 7);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const pointLight = new THREE.PointLight(0x3b82f6, 4, 10);
    pointLight.position.set(0, 2, 0);
    scene.add(pointLight);

    // 2. 3D Elements Creation (3D वस्तुएँ बनाना)
    // Ground
    const groundGeo = new THREE.PlaneGeometry(50, 50);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Forest Rocks & Foliage (पहाड़ और जंगल)
    const forestGroup = new THREE.Group();
    for (let i = 0; i < 30; i++) {
      const size = 0.5 + Math.random() * 1.5;
      const geo = new THREE.DodecahedronGeometry(size);
      const mat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.8 });
      const rock = new THREE.Mesh(geo, mat);
      rock.position.set((Math.random() - 0.5) * 30, size / 2, (Math.random() - 0.5) * 30);
      rock.castShadow = true;
      rock.receiveShadow = true;
      forestGroup.add(rock);
    }
    scene.add(forestGroup);

    // Magical Bioluminescent Flower (चमकता हुआ फूल)
    const flowerGeo = new THREE.ConeGeometry(0.2, 0.8, 4);
    const flowerMat = new THREE.MeshStandardMaterial({ color: 0x60a5fa, emissive: 0x3b82f6, emissiveIntensity: 2 });
    const flower = new THREE.Mesh(flowerGeo, flowerMat);
    flower.position.set(0, 0.4, -2);
    scene.add(flower);

    // Robot (कार्टून रोबोट)
    const robot = new THREE.Group();
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0xe4e4e7, roughness: 0.2 }));
    head.position.y = 1.1;
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.7, 8), new THREE.MeshStandardMaterial({ color: 0x3f3f46 }));
    body.position.y = 0.5;
    robot.add(head, body);
    scene.add(robot);

    // 3. Simple Rendering Progress Animation (आधे फ्रेम और लाइव प्रगति)
    let frame = 0;
    const maxFrames = 225; // 15 seconds @ 15fps
    let renderInterval;

    description.textContent = `A tiny cute robot exploring a bioluminescent forest, finding a magical glowing flower. Job: ${vidId}`;

    function startSceneRender() {
      renderInterval = setInterval(() => {
        frame++;
        const pct = Math.floor((frame / maxFrames) * 100);
        
        progressBar.style.width = `${pct}%`;
        statusLabel.textContent = `Rendering frame: ${frame} / ${maxFrames}`;
        timeLabel.textContent = `${Math.ceil((maxFrames - frame) / 15)}s left`;

        // Animate Camera & Robot (कैरेक्टर और कैमरा मूवमेंट)
        robot.position.z = THREE.MathUtils.lerp(3, -1.5, frame / maxFrames);
        robot.position.y = Math.abs(Math.sin(frame * 0.15)) * 0.1; // Bobbing effect (चलना)
        camera.position.x = Math.sin(frame * 0.01) * 10;
        camera.position.z = Math.cos(frame * 0.01) * 10;
        camera.lookAt(robot.position);

        renderer.render(scene, camera);

        if (frame >= maxFrames) {
          clearInterval(renderInterval);
          finishRender();
        }
      }, 66); // ~15 FPS
    }

    function finishRender() {
      statusLabel.textContent = "✓ Completed";
      progressBar.style.width = "100%";
      timeLabel.textContent = "0s";
      description.textContent = "Your video has been rendered and compiles successfully with local GPU & AI Voice.";
      downloadBtn.disabled = false;
      
      // AI Voice play placeholder (आवाज बजाने की टेस्टिंग)
      const utterance = new SpeechSynthesisUtterance("वाह! इस जादुई दुनिया में... यह चमकता हुआ फूल कितना सुंदर है!");
      utterance.lang = "hi-IN";
      window.speechSynthesis.speak(utterance);
    }

    startSceneRender();

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Dummy Download
    downloadBtn.addEventListener('click', () => {
      alert("Downloading of MP4 from local client WebGL Canvas starts shortly!");
    });
  </script>
</body>
</html>
