<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetra3D Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .studio-card {
      width: 100%;
      max-width: 660px;
      background: #121217;
      border: 1px solid #262630;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .live-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      flex-shrink: 0;
    }
    .live-badge.ready {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }
    .preview-box {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid #27272a;
    }
    canvas, video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    video { display: none; }
    .render-bar {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 9px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .progress-track {
      width: 150px;
      height: 5px;
      background: #27272a;
      border-radius: 99px;
      margin-top: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #6366f1;
      transition: width 0.15s linear;
    }
    .download-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: #6366f1;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .download-btn:active { transform: scale(0.99); }
    .download-btn.locked {
      background: #1e1e26;
      color: #71717a;
      border: 1px solid #2e2e38;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="studio-card">
    <div class="card-header">
      <h1 class="card-title" id="uiTitle">Kinetra3D Studio</h1>
      <span class="live-badge" id="uiBadge">LIVE PREVIEW</span>
    </div>

    <div class="preview-box" id="previewContainer">
      <video id="finalPlayer" controls playsinline loop></video>
      <div class="render-bar" id="renderHud">
        <div>
          <span id="uiStatus">Rendering 3D Scene & Voice...</span>
          <div class="progress-track"><div class="progress-fill" id="uiProgress"></div></div>
        </div>
        <span id="uiTimer">15s</span>
      </div>
    </div>

    <!-- Future Ad-Unlock Hook: Add your ad trigger on this single button later -->
    <a id="uiDownloadBtn" class="download-btn locked" download="kinetra3d-video.webm">Generating Video...</a>
  </div>

  <!-- Separate Dedicated Power Engine -->
  <script src="./engine.js"></script>
</body>
</html>
