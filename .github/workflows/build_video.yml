name: Kinetra3D Hollywood Render Engine

on:
  repository_dispatch:
    types: [render-3d-video]

concurrency:
  group: 3d-render-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  render-movie:
    name: 3D Render & AI Voice
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Blender 5.0, EGL Graphics & Open-Source Engine
        run: |
          # 1. ग्राफ़िक्स की मिसिंग EGL लाइब्रेरीज़ और वर्चुअल डिस्प्ले (xvfb) इंस्टॉल करें
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 xvfb libxkbcommon-x11-0 libsm6 libxext6 libxrender-dev
          
          # 2. Blender इंस्टॉल करें
          sudo snap install blender --classic
          
          # 3. Blender के धांसू ओपन-सोर्स प्लगइन्स एक्टिवेट करें
          mkdir -p ~/.config/blender/4.0/scripts/startup
          echo "import bpy" > ~/.config/blender/4.0/scripts/startup/enable_addons.py
          echo "bpy.ops.preferences.addon_enable(module='rigify')" >> ~/.config/blender/4.0/scripts/startup/enable_addons.py
          echo "bpy.ops.preferences.addon_enable(module='ant_landscape')" >> ~/.config/blender/4.0/scripts/startup/enable_addons.py
          echo "bpy.ops.preferences.addon_enable(module='node_wrangler')" >> ~/.config/blender/4.0/scripts/startup/enable_addons.py

      - name: 🧠 AI Script Injection & 3D Rendering
        env:
          BLENDER_CODE: ${{ github.event.client_payload.blender_code }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          echo "$BLENDER_CODE" > ai_scene.py
          
          # xvfb-run का इस्तेमाल करके वर्चुअल स्क्रीन पर Blender चलाएं (ताकि क्रैश न हो)
          xvfb-run -a blender -b -P ai_scene.py -o //render_output_${JOB_ID}_ -F FFMPEG -x 1 -a

      - name: 🗣️ Generate AI Voiceover & Merge (FFmpeg)
        env:
          NARRATION: ${{ github.event.client_payload.narration }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          sudo apt-get install -y ffmpeg edge-tts
          
          if [ -n "$NARRATION" ]; then
            edge-tts --text "$NARRATION" --voice "en-US-ChristopherNeural" --write-media voice_${JOB_ID}.mp3
            ffmpeg -i render_output_${JOB_ID}_0001-0250.mp4 -i voice_${JOB_ID}.mp3 -c:v copy -c:a aac final_${JOB_ID}.mp4
          else
            mv render_output_${JOB_ID}_0001-0250.mp4 final_${JOB_ID}.mp4
          fi

          ffmpeg -i final_${JOB_ID}.mp4 -vf "fps=10,scale=320:-1:flags=lanczos" -c:v gif preview_${JOB_ID}.gif

      - name: ☁️ Upload to Cloudinary (Auto-Delete after 5 mins)
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          curl -X POST "https://api.cloudinary.com/v1_1/cltgefea/video/upload" \
            -F "file=@final_${JOB_ID}.mp4" \
            -F "public_id=${JOB_ID}" \
            -F "upload_preset=ml_default"
            
          curl -X POST "https://api.cloudinary.com/v1_1/cltgefea/image/upload" \
            -F "file=@preview_${JOB_ID}.gif" \
            -F "public_id=${JOB_ID}_preview" \
            -F "upload_preset=ml_default"
